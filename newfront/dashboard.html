<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docq - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Docq</a>
            <button class="btn btn-outline-primary" onclick="logout()">Logout</button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="d-flex">
        <!-- Sidebar -->
        <div class="sidebar bg-white shadow-sm p-3 d-flex flex-column">
            <div class="flex-grow-1">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="mb-0">Available Documents</h5>
                    <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#uploadModal">
                        <i class="bi bi-upload"></i> Upload
                    </button>
                </div>
                <div class="mb-2 text-muted small" id="selectionInfo">0 of 0 selected</div>
                <div id="documentList" class="list-group">
                    <!-- Documents will be loaded here -->
                </div>
            </div>
            
            <!-- Action Buttons -->
            <div class="mt-3 border-top pt-3">
                <div class="d-grid gap-2">
                    <button class="btn btn-danger" onclick="deleteSelectedDocuments()" id="deleteBtn" disabled>
                        Delete Selected
                    </button>
                    <button class="btn btn-primary" onclick="openGrantAccessModal()" id="grantAccessBtn" disabled>
                        Grant Access
                    </button>
                    <button class="btn btn-warning" onclick="openRevokeAccessModal()" id="revokeAccessBtn" disabled>
                        Revoke Access
                    </button>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <!-- Response Area -->
            <div class="response-area bg-light">
                <div id="responseContent" class="container">
                    <!-- Responses will be displayed here -->
                </div>
            </div>

            <!-- Query Area -->
            <div class="query-area bg-white">
                <div class="container">
                    <form id="queryForm" class="mb-0">
                        <div class="row g-2">
                            <div class="col">
                                <textarea 
                                    class="form-control" 
                                    id="queryInput" 
                                    rows="3" 
                                    placeholder="Enter your query..."
                                    required
                                ></textarea>
                            </div>
                            <div class="col-auto">
                                <button type="submit" class="btn btn-primary h-100">Search</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Upload Document</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="uploadForm">
                        <div class="mb-3">
                            <label for="fileInput" class="form-label">Select File</label>
                            <input type="file" class="form-control" id="fileInput" accept=".pdf,.docx,.txt" required>
                            <div class="form-text">Supported formats: PDF, DOCX, TXT</div>
                        </div>
                        <div id="uploadError" class="alert alert-danger d-none"></div>
                        <div id="uploadSuccess" class="alert alert-success d-none"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="uploadDocument()">Upload</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Delete</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p>Are you sure you want to delete the selected documents? This action cannot be undone.</p>
                    <div id="deleteError" class="alert alert-danger d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" onclick="confirmDelete()">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Grant Access Modal -->
    <div class="modal fade" id="grantAccessModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Grant Document Access</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text" class="form-control" id="userSearchInput" placeholder="Search users...">
                            <button class="btn btn-outline-secondary" type="button" onclick="searchUsers()">Search</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 40px;">
                                        <input type="checkbox" class="form-check-input" id="selectAllUsers">
                                    </th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="userList">
                                <!-- Users will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="grantAccessError" class="alert alert-danger d-none"></div>
                    <div id="grantAccessSuccess" class="alert alert-success d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" onclick="grantAccessToSelectedUsers()">Grant Access</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Revoke Access Modal -->
    <div class="modal fade" id="revokeAccessModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Revoke Document Access</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <div class="input-group">
                            <input type="text" class="form-control" id="revokeUserSearchInput" placeholder="Search users...">
                            <button class="btn btn-outline-secondary" type="button" onclick="searchRevokeUsers()">Search</button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table table-hover">
                            <thead>
                                <tr>
                                    <th style="width: 40px;">
                                        <input type="checkbox" class="form-check-input" id="selectAllRevokeUsers">
                                    </th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="revokeUserList">
                                <!-- Users will be loaded here -->
                            </tbody>
                        </table>
                    </div>
                    <div id="revokeAccessError" class="alert alert-danger d-none"></div>
                    <div id="revokeAccessSuccess" class="alert alert-success d-none"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-warning" onclick="revokeAccessFromSelectedUsers()">Revoke Access</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="base.js"></script>
    <script src="auth.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
