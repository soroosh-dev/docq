{% load static %}
<!DOCTYPE HTML>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your password</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #000000;
      font-family: 'Raleway', sans-serif;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .content {
      padding: 40px 20px;
      text-align: left;
    }
  </style>
</head>

<body>
  <div class="container">
    <table style="width: 100%;">
      <tr>
        <td colspan="2" class="content">
          <p>
            <span><strong>Having problem with your password? <br> Let's reset that.</strong></span>
          </p>
          <p>In order to reset your password click on <a href="{{ password_reset_link }}" target="_blank" title="Password reset link">this link</a> and you are good to go.</p>
          <p>Password reset link: <a href="{{password_reset_link}}" target="_blank" title="password reset link">{{password_reset_link}}</a>
          <br>
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
